<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#505050"><link rel="manifest" href="./manifest.json"><title>Skyplane — Cloud Run</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#505050;font-family:system-ui,sans-serif;touch-action:none}canvas{display:block;width:100vw;height:100dvh}.hud{position:fixed;inset:0;color:white;pointer-events:none}.top{position:absolute;top:max(18px,env(safe-area-inset-top));left:0;right:0;display:flex;justify-content:space-between;padding:0 20px}.brand{font-size:13px;font-weight:800;letter-spacing:2px}.score{text-align:right;font-weight:800}.score small{display:block;font-size:10px;letter-spacing:2px;opacity:.7}.pause{pointer-events:auto;position:absolute;right:18px;top:70px;border:1px solid #ffffff55;background:#ffffff15;color:white;border-radius:50%;width:40px;height:40px;font-size:18px}.overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;background:#25252575;backdrop-filter:blur(4px);color:white}.hidden{display:none!important}.panel{width:min(100%,350px);text-align:center;border:1px solid #ffffff30;border-radius:24px;padding:30px 24px;background:#444b}.planeMark{font-size:48px;display:inline-block;transform:rotate(-90deg)}h1{font-size:29px;letter-spacing:2px;margin:12px 0 6px}.panel p{font-size:14px;line-height:1.65;color:#e2e2e2;margin:12px 0 22px}.primary{border:0;background:#f3f3f3;color:#333;border-radius:999px;padding:14px 24px;font-size:14px;font-weight:800;letter-spacing:1px;width:100%}.hint{font-size:11px!important;opacity:.7;margin-bottom:0!important}
</style></head><body><canvas id="game"></canvas><div class="hud"><div class="top"><div class="brand">SKYPLANE <span style="opacity:.55">/ CLOUD RUN</span></div><div class="score"><span id="score">000</span><small>BEST <span id="best">000</span></small></div></div><button class="pause" id="pause">Ⅱ</button></div>
<div class="overlay" id="startScreen"><div class="panel"><div class="planeMark">✈</div><h1>SKYPLANE</h1><p>Cloud Run<br>মেঘের ফাঁক দিয়ে বিমান চালাও। বাম/ডান পাশে টাচ করলে বিমান সেই দিকে যাবে; উপরের দিকে টাচ করলে উঠবে, ছেড়ে দিলে নামবে।</p><button class="primary" id="start">START FLIGHT</button><p class="hint">LEFT / RIGHT TO STEER · HOLD HIGH TO CLIMB</p></div></div>
<div class="overlay hidden" id="endScreen"><div class="panel"><div class="planeMark">✈</div><h1>FLIGHT OVER</h1><p>তোমার স্কোর <b id="finalScore">0</b><br>Best score: <b id="finalBest">0</b></p><button class="primary" id="restart">FLY AGAIN</button></div></div>
<div class="overlay hidden" id="pauseScreen"><div class="panel"><div class="planeMark">Ⅱ</div><h1>PAUSED</h1><p>তোমার ফ্লাইট থামানো হয়েছে।</p><button class="primary" id="resume">RESUME FLIGHT</button></div></div>
<script>
(()=>{const c=document.querySelector('canvas'),x=c.getContext('2d'),$=id=>document.getElementById(id);let W,H,dpr,p,runs=false,paused=false,hold=false,moveDir=0,pointerStartX=null,clouds=[],score=0,best=+(localStorage.skyplaneBest||0),last=0,spawn=0,speed=190;
$('best').textContent=String(best).padStart(3,'0');
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;x.setTransform(dpr,0,0,dpr,0,0);if(!runs)draw()}addEventListener('resize',resize);
function puff(cx,cy,s,col){x.save();x.translate(cx,cy);x.scale(s,s);x.fillStyle=col;x.beginPath();x.arc(-35,8,37,0,7);x.arc(0,-12,45,0,7);x.arc(39,5,37,0,7);x.arc(70,19,27,0,7);x.rect(-43,8,141,37);x.fill();x.restore()}
function drawPlane(){x.save();x.translate(p.x,p.y);x.rotate(p.angle);x.fillStyle='#f8f8f8';x.beginPath();x.moveTo(0,-28);x.lineTo(5,-6);x.lineTo(43,0);x.quadraticCurveTo(47,4,42,7);x.lineTo(7,8);x.lineTo(5,24);x.lineTo(15,29);x.lineTo(15,33);x.lineTo(1,31);x.lineTo(0,45);x.lineTo(-2,31);x.lineTo(-15,33);x.lineTo(-15,29);x.lineTo(-5,24);x.lineTo(-7,8);x.lineTo(-42,7);x.quadraticCurveTo(-47,4,-43,0);x.lineTo(-5,-6);x.closePath();x.fill();x.fillStyle='#222';x.fillRect(-4,-17,8,9);x.strokeStyle='#fff';x.lineWidth=2;x.beginPath();x.moveTo(-15,-31);x.lineTo(15,-31);x.stroke();x.restore()}
function draw(){x.clearRect(0,0,W,H);x.fillStyle='#505050';x.fillRect(0,0,W,H);puff(-75,H*.27,2.15,'#777');puff(-83,H*.27-19,2.15,'#ededed');puff(W+72,H*.76,2.05,'#777');puff(W+65,H*.76-17,2.05,'#ededed');clouds.forEach(q=>{puff(q.x,q.top-14,q.s,'#777');puff(q.x-8,q.top-25,q.s,'#eee');puff(q.x,q.bottom+20,q.s,'#777');puff(q.x-8,q.bottom+8,q.s,'#eee')});if(p){x.save();x.globalAlpha=.22;x.translate(p.x+8,p.y+75);x.scale(.75,.75);x.fillStyle='#111';x.fillRect(-28,-4,56,8);x.fillRect(-4,-25,8,65);x.restore();drawPlane()}}
function addCloud(){let gap=Math.max(175,Math.min(235,H*.22)),top=100+Math.random()*(H-gap-200);clouds.push({x:W+90,top,bottom:top+gap,s:.8+Math.random()*.4,passed:false})}
function reset(){score=0;spawn=0;speed=190;clouds=[];p={x:W*.5,y:H*.48,vy:0,angle:0};runs=true;paused=false;hold=false;moveDir=0;pointerStartX=null;$('score').textContent='000';$('startScreen').classList.add('hidden');$('endScreen').classList.add('hidden');$('pauseScreen').classList.add('hidden');$('pause').textContent='Ⅱ';last=performance.now();requestAnimationFrame(loop)}
function over(){if(!runs)return;runs=false;hold=false;if(score>best){best=score;localStorage.skyplaneBest=best}$('best').textContent=String(best).padStart(3,'0');$('finalScore').textContent=score;$('finalBest').textContent=best;$('endScreen').classList.remove('hidden')}
function loop(now){if(!runs||paused)return;let dt=Math.min((now-last)/1000,.035);last=now;spawn+=dt;speed=190+Math.min(score*2,115);if(spawn>Math.max(.95,1.5-score*.008)){spawn=0;addCloud()}p.vy+=(hold?-520:500)*dt;p.vy=Math.max(-245,Math.min(280,p.vy));p.y+=p.vy*dt;p.x+=moveDir*260*dt;p.x=Math.max(30,Math.min(W-30,p.x));p.angle=Math.max(-.55,Math.min(.55,moveDir*.28+p.vy/700));clouds.forEach(q=>{q.x-=speed*dt;let r=16;if(p.x+r>q.x-50*q.s&&p.x-r<q.x+45*q.s&&(p.y-r<q.top||p.y+r>q.bottom))over();if(!q.passed&&q.x+40*q.s<p.x){q.passed=true;score++;$('score').textContent=String(score).padStart(3,'0')}});clouds=clouds.filter(q=>q.x>-160);if(p.y<28||p.y>H-35)over();draw();if(runs&&!paused)requestAnimationFrame(loop)}
function idle(){p={x:W*.5,y:H*.49,vy:0,angle:0};clouds=[];draw()}function setHold(v){if(runs&&!paused)hold=v}
function pointerDown(e){if(!runs||paused)return;e.preventDefault();pointerStartX=e.clientX;moveDir=e.clientX<W/2?-1:1;hold=e.clientY<H*.42;}
function pointerMove(e){if(pointerStartX===null||!runs||paused)return;const dx=e.clientX-pointerStartX;if(Math.abs(dx)>12)moveDir=dx<0?-1:1;else moveDir=e.clientX<W/2?-1:1;hold=e.clientY<H*.42;}
function pointerUp(){pointerStartX=null;moveDir=0;hold=false;}
c.addEventListener('pointerdown',pointerDown);c.addEventListener('pointermove',pointerMove);addEventListener('pointerup',pointerUp);addEventListener('pointercancel',pointerUp);
$('start').onclick=reset;$('restart').onclick=reset;$('pause').onclick=()=>{if(!runs&&!paused)return;paused=true;hold=false;$('pauseScreen').classList.remove('hidden');$('pause').textContent='▶'};$('resume').onclick=()=>{paused=false;$('pauseScreen').classList.add('hidden');$('pause').textContent='Ⅱ';last=performance.now();requestAnimationFrame(loop)};
addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='ArrowUp'){e.preventDefault();setHold(true)}if(e.code==='ArrowLeft'||e.code==='KeyA')moveDir=-1;if(e.code==='ArrowRight'||e.code==='KeyD')moveDir=1;if(e.code==='Escape'&&runs)$('pause').click()});addEventListener('keyup',e=>{if(e.code==='Space'||e.code==='ArrowUp')setHold(false);if(['ArrowLeft','ArrowRight','KeyA','KeyD'].includes(e.code))moveDir=0});
resize();idle();if('serviceWorker'in navigator&&location.protocol.startsWith('http'))addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
})();
</script></body></html>
